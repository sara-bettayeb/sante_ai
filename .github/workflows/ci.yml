name: Sante AI - CI/CD Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  automated-tests:
    name: Run Pytest & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest streamlit "numpy==1.26.4" "pandas<2.2.3" "scikit-learn==1.6.1" "pyarrow<17.0.0" catboost xgboost lightgbm joblib

      - name: Verify Python Files Syntax
        run: |
          python -m py_compile database.py app.py

      - name: Execute Automated Tests (Pytest)
        run: |
          if [ -d "tests"]; then pytest -v; else echo "waiting for tests folder"; fi

  docker-build-check:
    name: Verify Docker Compose Build
    needs: automated-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Build Docker Containers
        run: |
          docker compose build